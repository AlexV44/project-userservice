spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/userservice_db
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true